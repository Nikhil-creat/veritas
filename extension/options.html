<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        background: #0f1729;
        color: #f7f5f0;
        padding: 24px;
        max-width: 420px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #64748b;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        background: #1b2740;
        border: 1px solid #1b2740;
        color: #f7f5f0;
        border-radius: 2px;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        padding: 8px 16px;
        background: #e8a23d;
        color: #0f1729;
        border: none;
        border-radius: 2px;
        font-weight: 600;
        cursor: pointer;
      }
      p.status {
        font-size: 12px;
        color: #2d9c8a;
        margin-top: 8px;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h2>Veritas — API endpoint</h2>
    <p style="color:#64748b; font-size:13px;">
      Point this at your deployed Veritas instance (e.g. a Vercel URL), or
      leave it as localhost while you're developing.
    </p>
    <label for="apiBase">API base URL</label>
    <input id="apiBase" type="text" placeholder="https://your-veritas-app.vercel.app" />
    <button id="save">Save</button>
    <p class="status" id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
